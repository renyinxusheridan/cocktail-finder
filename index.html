<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocktail Finder</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">
        <header>
            <p class="eyebrow">DISCOVER YOUR NEXT COCKTAIL</p>
            <h1>Cocktail Finder</h1>
            <p>Find a recipe by name, then explore its ingredients and instructions.</p>
        </header>


        <form id="search-form" novalidate>
            <label for="cocktail-name">Cocktail name</label>
            <div class="search-row">
                <input id="cocktail-name" name="cocktail" type="search"
                    placeholder="e.g. Margarita" aria-describedby="search-hint" required>
                <button type="submit">Search</button>
            </div>
            <p id="search-hint" class="hint">Try Margarita, Mojito, or a part of a cocktail name.</p>
        </form>

        <p id="status" role="status" aria-live="polite" aria-atomic="true">Enter a cocktail name to get started.</p>
        <section aria-labelledby="results-heading" id="results-section" aria-busy="false">
            <h2 id="results-heading">Recipes</h2>
            <div id="results" class="results-grid"></div>
        </section>
        <noscript>Please enable JavaScript to search for cocktail recipes.</noscript>
        <footer>Recipe data and images from <a href="https://www.thecocktaildb.com/">TheCocktailDB</a>.</footer>
    </main>
</body>

</html>
